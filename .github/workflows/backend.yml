name: Backend

# Compiles the API with every compiler warning an error, then runs all of its tests, which include the ones that start real
# PostgreSQL with PostGIS and real Redis in containers (the runner has Docker). The tests that reach the real TTC feeds are
# tagged `live`, excluded here on purpose, and run by the nightly workflow instead.

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      # Run through sh: a checkout made on Windows does not mark the wrapper executable. -Werror turns the compiler's
      # warnings (every category is on, see the compiler plugin in the pom) into failures, which is the static analysis
      # that gates a merge. The build had none when this was written, so this keeps it that way rather than clearing a backlog.
      - name: Verify
        run: sh ./mvnw -B -ntp -Dmaven.compiler.failOnWarning=true verify

      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: services/api/target/surefire-reports
          retention-days: 7

      - name: Keep the packaged application
        uses: actions/upload-artifact@v7
        with:
          name: api-jar
          path: services/api/target/trackline-api-*.jar
          retention-days: 7
          if-no-files-found: error
