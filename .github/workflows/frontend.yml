name: Frontend

# Two jobs. `check` is the fast one: lint, types, unit tests, a production build and a dependency audit. `e2e` runs real Chrome
# against the real application, packaged API included, with only the TTC replaced by a fixture feed (apps/web/e2e/stack.ts).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # pnpm comes from Corepack at the version package.json pins, so CI and a laptop run the same one.
      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Type-check
        run: corepack pnpm typecheck

      - name: Unit tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      # What ships to a visitor: a high-severity advisory in a runtime dependency fails the build.
      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level=high

      # Everything, including tooling that never ships. Reported and not gating, because one high-severity advisory there (braces,
      # reached only through the linter) has no patched release to move to. The step is here so that changes and is seen.
      - name: Audit all dependencies (report)
        continue-on-error: true
        run: corepack pnpm audit --audit-level=high

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The stack starts PostgreSQL and Redis from docker-compose.yml, which reads these. The values mean nothing outside this job.
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "56432"
      REDIS_PORT: "56379"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The stack runs the packaged application, so it is built here without its tests, which the backend workflow runs.
      - name: Package the API
        working-directory: services/api
        run: sh ./mvnw -B -ntp -DskipTests package

      - name: Install dependencies
        working-directory: apps/web
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      # The tests drive the Chrome installed on the machine, as the Playwright configuration says. Fail early and plainly if
      # a runner image ever stops shipping it, rather than as a launch error forty seconds into the first test.
      - name: Check that Chrome is installed
        run: google-chrome --version

      - name: Run the tests
        working-directory: apps/web
        run: corepack pnpm e2e

      - name: Keep the report, and what the application said
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/.stack/*.log
          retention-days: 7
          if-no-files-found: ignore
          # The application's own logs are under e2e/.stack, which is a hidden folder and is skipped unless asked for.
          include-hidden-files: true
