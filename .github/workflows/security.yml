name: Security

# CodeQL reads the source of both applications for the kinds of flaw that tests do not look for, and the dependency review
# compares what a pull request adds to its dependencies against published advisories. Findings appear in the repository's
# Security tab (CodeQL) and on the pull request (dependency review). Dependabot, configured in .github/dependabot.yml, proposes
# the updates that these point to.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because advisories are published against code that has not changed.
    - cron: "40 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      # No build: for both languages CodeQL can analyse the source directly, which keeps this independent of the protobuf
      # compiler download and of the Node toolchain.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
