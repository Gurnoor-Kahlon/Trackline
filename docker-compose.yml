name: trackline

# Two ways to use this file.
#
#   docker compose up -d                  just PostgreSQL and Redis; the API and the web app run natively
#                                         (./mvnw spring-boot:run, pnpm dev) for fast reloads.
#   docker compose --profile full up -d --build
#                                         everything in containers, as it would run in production: the API image,
#                                         the web image, and the two stores. Then load the schedule once:
#                                         docker compose --profile full run --rm \
#                                           -e TRACKLINE_GTFS_REALTIME_ENABLED=false \
#                                           -e TRACKLINE_HISTORY_ENABLED=false api --import-gtfs
#                                         (the two settings keep this one-off process from polling the feeds
#                                         beside the running API while it imports)

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: trackline-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackline}
      POSTGRES_USER: ${POSTGRES_USER:-trackline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d/-U are required: without them pg_isready reports ready while the
      # init scripts are still running, which breaks depends_on ordering.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackline} -d ${POSTGRES_DB:-trackline}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trackline-redis
    command:
      # Live state is ephemeral and reconstructed on the next ingestion cycle,
      # so persistence is off deliberately. PostgreSQL owns everything durable.
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- the application, in containers (profile: full) -------------------------------------------------------------

  api:
    profiles: ["full"]
    build:
      context: ./services/api
    image: trackline-api:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # The production profile, so what runs here is what runs there: structured logs, only the health endpoint exposed,
      # no manual import endpoint.
      SPRING_PROFILES_ACTIVE: prod
      # Service names, not localhost: inside the compose network these are the stores' addresses, and the ports are the
      # containers' own, not the ones published on the host.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-trackline}
      POSTGRES_USER: ${POSTGRES_USER:-trackline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Where a browser is when it calls the API.
      TRACKLINE_CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      # Not marked required here, because compose reads every service's settings even when starting only the databases, and
      # `docker compose up -d` must work before this is chosen. The API refuses to start without it, and says why.
      TRACKLINE_AUTH_JWT_SECRET: ${TRACKLINE_AUTH_JWT_SECRET:-}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      args:
        # Where a browser reaches the API. Written into the page at build time, so changing it means building again.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    image: trackline-web:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Where this server reaches the API, which on this network is not where a browser does.
      API_INTERNAL_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
