# Production. Origins and port come from the environment; nothing is defaulted to
# a permissive value. Logs are emitted as ECS JSON so CloudWatch can query them
# by field — this uses Spring Boot's built-in structured logging, no extra
# dependency or logback XML.
trackline:
  cors:
    allowed-origins: ${TRACKLINE_CORS_ALLOWED_ORIGINS}
  gtfs:
    static:
      # The manual import endpoint is not registered here: it has no administrator to protect it. The command-line
      # runner remains, and is how the schedule is loaded: `java -jar app.jar --import-gtfs`.
      admin-endpoint: false

server:
  # Behind a load balancer, the address a connection comes from is the balancer's, so the live stream's limit of connections per
  # address would count the whole site as one visitor and allow it 20 streams. `native` has Tomcat take the real address from
  # X-Forwarded-For, but only from a proxy on a private address (its default list of trusted proxies), and from the right of the
  # header, where the balancer put it, so a visitor cannot make up an address by sending the header themselves.
  forward-headers-strategy: native

# Kept on deliberately: Trackline's API is public, with accounts only for saved routes, so a browsable
# contract is a feature rather than exposure. Set explicitly so it is a decision
# rather than a framework default.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    ca.trackline: INFO
    org.springframework.web: WARN
