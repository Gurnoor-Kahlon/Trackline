spring:
  application:
    name: trackline-api
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trackline}
    username: ${POSTGRES_USER:trackline}
    # No default: a missing database password must stop startup, not fall back to
    # a guessable one.
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      # Ingestion holds a connection for a whole cycle, so a request must fail
      # fast rather than queue behind it indefinitely.
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # A cache call that has not answered in this long has already cost more than
      # the database query it was meant to avoid.
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    hibernate:
      # The schema is owned by Flyway migrations. Hibernate only checks that the
      # entities match what the migrations produced, and never alters anything.
      ddl-auto: validate
    # Lazy loading must not be triggered while rendering a response; every read
    # path fetches what it needs explicitly.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Every environment starts from an empty database and migrates forward, so
    # out-of-order or baselined migrations are never expected.
    validate-on-migrate: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

trackline:
  gtfs:
    static:
      # Resolved through the catalogue rather than a pinned download URL, so a
      # republished resource does not silently break the import.
      catalogue-url: https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show
      dataset-id: ttc-routes-and-schedules
      request-timeout: 5m
      # The real archive is about 36 MB; the caps leave generous headroom while
      # still refusing a download or an entry that has no business being this big.
      max-archive-bytes: 268435456
      max-entry-bytes: 1073741824
      max-entries: 64
      copy-batch-bytes: 8388608
      admin-endpoint: true
    realtime:
      base-url: https://bustime.ttc.ca/gtfsrt
      # Timeouts suited to a poll, not a download: a feed that has not answered in
      # five seconds has already missed the cycle it was for.
      connect-timeout: 2s
      read-timeout: 5s
      # Measured over five minutes: every feed advances its header about every 20 s
      # (median 20-21 s, fastest 6 s, slowest 42 s). Vehicles are polled at half
      # that to keep positions fresh; trip updates match the publish rate because
      # the payload is 480 KB; alerts change a few times a day.
      vehicle-interval: 10s
      trip-update-interval: 20s
      alert-interval: 60s
      # The largest payload measured is 480 KB. This is headroom, not a target.
      max-response-bytes: 16777216
      # Above this share of dropped entities the cycle is recorded as suspect
      # rather than trusted.
      suspect-rejection-rate: 0.25
      # Service thins out overnight, but not by four fifths between one cycle and
      # the next.
      suspect-drop-ratio: 0.2
      # A stationary vehicle is still recorded this often, so it stays visibly
      # alive without storing a row every cycle.
      min-observation-gap: 60s
      min-observation-metres: 25
      enabled: true
  live-state:
    # Longer than the poll interval so a snapshot survives a slow cycle, short
    # enough that a dead ingester's last snapshot expires instead of being served
    # forever as though it were current.
    snapshot-ttl: 2m
  stream:
    # Idle connections are written to this often. Short enough that a proxy with a
    # typical 60 s idle timeout never closes one, and that a vanished client is
    # found within about a beat.
    heartbeat-interval: 15s
    # Recent events kept for clients that drop and resume. A cycle arrives about
    # every 20 s, so 30 events cover about ten minutes: longer than a flaky mobile
    # connection normally stays down. What that costs in memory, at the event size
    # measured on the live feed, is recorded in docs/streaming.md.
    ring-capacity: 30
    # Every connection holds a queue and a delivery thread while open.
    max-subscribers: 500
    max-subscribers-per-client: 20
    # A connection is ended this often and the client reconnects and resumes,
    # which renews it without anyone noticing.
    emitter-timeout: 30m
    # Events a slow client may fall behind before it is dropped to resume. At one
    # event per 20 s this is over ten minutes of backlog, so only a stalled
    # connection is ever dropped.
    queue-capacity: 32
    # A vehicle is re-sent when it has moved this far from where it was last sent.
    # Below it the marker would not visibly move.
    move-threshold-metres: 5
    # A reporting vehicle is re-sent at least this often even if it has not moved,
    # so one held at a light does not look silent and get dimmed as stale. Matches
    # the observation writer's heartbeat for stationary vehicles.
    keepalive-interval: 60s
  analytics:
    # Thresholds for placing a vehicle on its route, each set from a measurement
    # over 1,089 route-assigned vehicles in a real snapshot (docs/route-progress.md).
    progress:
      # The nearest shape was within 5 m for half the vehicles and within 16 m for
      # nine in ten, then there is a gap: 1,013 are within 150 m and 1,017 within
      # 250 m. The remaining 7% were hundreds of metres to 10 km away. The figure
      # sits in the empty middle, so it is not sensitive.
      max-offset-metres: 150
      # Where the vehicle's heading and the shape's direction differ by at most this,
      # they agree. Two directions of one street differ by about 180, so a wide
      # window still singles out one; 60 leaves room for a vehicle mid-turn.
      bearing-tolerance-degrees: 60
      # Between readings the writer stores only vehicles that moved 25 m or more, so
      # genuine travel clears this easily; GPS jitter on a stationary vehicle does not.
      min-movement-metres: 30
      # The feed advances about every 20 s and a stationary vehicle is stored every
      # 60 s, so five minutes spans several missed readings without reaching back to
      # where a vehicle was before it turned round.
      max-previous-age: 5m
      # Either side of the vehicle, so the direction is read across about 30 m.
      tangent-window-metres: 15
    # Route health: how evenly a route's vehicles are spaced, judged against the timetable
    # (docs/route-health.md). The variation and gap bands are round, documented starting
    # points, not fitted: the conventional reading of the coefficient of variation of
    # headway, to be recalibrated once stored samples exist. The windows and counts below
    # them are set from what the feed does.
    health:
      excellent-cv: 0.25
      unstable-cv: 0.5
      major-cv: 0.75
      excellent-gap-ratio: 1.3
      unstable-gap-ratio: 1.8
      major-gap-ratio: 2.5
      major-supply-ratio: 0.5
      min-vehicles: 2
      medium-confidence-vehicles: 3
      high-confidence-vehicles: 5
      min-gaps-for-variation: 3
      # The feed's own timestamps advance about every 20 s and a parked vehicle reports
      # about once a minute, so two minutes is several missed reports.
      stale-after: 120s
      stale-fraction-for-low-confidence: 0.3
      terminal-zone-metres: 200
      speed-window: 15m
      min-speed-span: 3m
      min-speed-readings: 3
      min-speed-vehicles: 3
      # About 90 km/h. Faster than any surface route runs: a figure above it is a
      # projection error, such as a vehicle matched to the far side of a loop.
      max-plausible-speed-metres-per-second: 25
      # Walking pace. The slowest routes measured ran about 2 m/s, streetcars on the busiest
      # downtown streets included; a median below this is vehicles on a layover.
      min-plausible-speed-metres-per-second: 1

    # Bunching: vehicles running in a pack while a gap opens elsewhere on the same direction
    # (docs/bunching-detection.md). Round starting points like the health bands, not fitted:
    # there is no ground truth of known bunching to fit them to.
    bunching:
      # Two neighbours are bunched when the gap between them is under this share of the expected spacing.
      close-ratio: 0.35
      # Reported only if a gap elsewhere is over this multiple of the expected spacing. Dense but
      # evenly spaced service is not bunching; this rule is what keeps it so.
      service-gap-ratio: 1.8
      severe-gap-ratio: 2.5
      severe-cluster-size: 3
      # With fewer vehicles no gap elsewhere can be established.
      min-vehicles: 3
      # Without a timetable the yardstick is the vehicles' own average, and with three vehicles a close
      # pair makes the other gap about twice that average by arithmetic alone. Four is the fewest at
      # which a pack beside a wide gap says something the average did not already guarantee.
      min-vehicles-without-timetable: 4
      # An open bunch is the same bunch as a new one when they share this many vehicles, so a
      # vehicle joining or leaving does not make a new event.
      min-shared-vehicles: 2
      # The feed advances about every 20 s, so two analyses without it is about a minute: long
      # enough that a bunch flickering across a threshold stays one event.
      cycles-to-resolve: 2
      # A pack is recorded only once seen on this many analyses in a row, about a minute. The first
      # live run recorded 166 packs in four minutes and most lasted one or two analyses: vehicles
      # passing at a stop. It is dated from its first sighting, so waiting loses no time.
      cycles-to-confirm: 3

  # Accounts and sign-in (docs/authentication.md).
  auth:
    # No default, as for the database password: a missing secret must stop startup, not fall back to a value anyone
    # reading this repository knows. At least 32 bytes; generate one with `openssl rand -base64 48`.
    jwt-secret: ${TRACKLINE_AUTH_JWT_SECRET}
    issuer: trackline
    # Short, since an access token cannot be taken back once issued.
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Two tabs refreshing at once send the same token; a repeat this soon is not treated as theft.
    refresh-reuse-leeway: 10s
    # Each step doubles the time to check one guess. Measured on the development laptop in docs/authentication.md.
    bcrypt-cost: 12
    min-password-length: 10
    max-failed-logins: 5
    failed-login-window: 15m

  # History: route health recorded over time, summarised by the hour, and trimmed (docs/history-and-reliability.md).
  history:
    # The hourly summary and the retention run on a schedule. Sampling rides on the ingestion cycle.
    enabled: true
    # The analysis runs about every 20 s and a verdict seldom changes between two runs. A minute keeps the
    # largest table to about a third of what a row per cycle would cost.
    sample-interval: 60s
    rollup-interval: 10m
    retention-interval: 6h
    startup-delay: 2m
    retention:
      samples: 90d
      # Longer than the samples it summarises, or dropping a partition would lose history.
      hourly: 365d
      observations: 14d
      bunching-events: 180d
      alerts: 180d
      # After they expire. A token used again is recognised by being on file, so it is kept well past its expiry.
      refresh-tokens: 7d
      # Every stored position refers to its run, so the runs outlive the positions.
      ingestion-runs: 30d
    # What a reliability figure needs before it is shown. Round starting points, not fitted: the aim is that
    # nothing is drawn from an afternoon.
    reliability:
      min-covered-hours: 24
      min-samples-per-hour: 20
      min-judged-samples: 240
      min-cell-samples: 60
      min-days-per-hour-cell: 3
      min-days-per-weekday-cell: 2

server:
  port: ${API_PORT:8080}
  error:
    # Errors are produced exclusively by the RFC 7807 handler; the servlet
    # container must never render its own page or leak internals.
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  health:
    # Redis is a cache whose absence degrades responses rather than breaking them,
    # so losing it must not mark the service unhealthy and take it out of a load
    # balancer that it can still serve from.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs/ui

info:
  app:
    name: Trackline
    description: Real-time Toronto transit intelligence

logging:
  level:
    ca.trackline: INFO
